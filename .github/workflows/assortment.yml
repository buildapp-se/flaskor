# Nattens spegelimport (beslut 23): laddar Systembolagsdumpen och postar den till Workern i bitar.
# 01:30 UTC är 03:30 svensk sommartid och 02:30 vintertid, i båda fallen efter dumpens förnyelse kl. 03:00.
# Kräver hemligheten FLASKOR_SERVICE_TOKEN (tjänstenyckeln, före 2026-09-16 grindkoden) i repots Actions-secrets.
name: Spegla Systembolagets sortiment

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assortment
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/assortment.ts
        env:
          FLASKOR_SERVICE_TOKEN: ${{ secrets.FLASKOR_SERVICE_TOKEN }}
